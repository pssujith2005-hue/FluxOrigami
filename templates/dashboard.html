<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | FluxOrigami</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-fuchsia-900/40 via-black to-black text-white min-h-screen font-sans flex flex-col antialiased selection:bg-fuchsia-500/30">
    
    <!-- Authenticated Glass Header -->
    <header class="bg-black/40 backdrop-blur-xl border-b border-white/10 p-4 sticky top-0 z-50 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-gradient-to-br from-fuchsia-600 to-purple-600 rounded-xl flex items-center justify-center font-bold shadow-[0_0_15px_rgba(192,38,211,0.5)]">F</div>
            <div class="text-xl font-bold tracking-wide">Flux<span class="text-fuchsia-500">Origami</span></div>
        </div>
        
        <div class="flex items-center gap-4">
            <span class="hidden md:block text-gray-400 font-medium mr-2">Welcome, <span class="text-white">{{ user.username }}</span></span>
            
            <!-- Profile Button -->
            <a href="#" class="flex items-center gap-2 text-sm bg-white/5 border border-white/10 hover:bg-white/10 hover:border-fuchsia-500/50 px-4 py-2 rounded-xl transition-all shadow-sm group">
                <svg class="w-4 h-4 text-fuchsia-400 group-hover:text-fuchsia-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                Profile
            </a>

            <!-- Django Secure Logout Form -->
            <form action="{% url 'logout' %}" method="post" class="inline m-0 p-0">
                {% csrf_token %}
                <button type="submit" class="flex items-center gap-2 text-sm bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500/20 hover:text-red-300 px-4 py-2 rounded-xl transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    Log Out
                </button>
            </form>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-8 pt-12">
        <h1 class="text-4xl font-extrabold mb-10 text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">Your Workspace</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Launch Workspace Card -->
            <a href="{% url 'workspace' %}" class="group relative block bg-white/5 backdrop-blur-sm border border-white/10 p-8 rounded-3xl hover:border-fuchsia-500/50 hover:bg-white/10 transition-all duration-300 shadow-xl overflow-hidden">
                <!-- Decorative glow behind the icon -->
                <div class="absolute top-8 left-8 w-20 h-20 bg-fuchsia-600/20 rounded-full blur-2xl group-hover:bg-fuchsia-500/40 transition-all duration-300"></div>
                
                <div class="relative w-14 h-14 bg-gradient-to-br from-fuchsia-500 to-purple-600 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 group-hover:rotate-3 transition-transform duration-300 shadow-lg">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                </div>
                <h2 class="relative text-2xl font-bold mb-2 text-white">New Component</h2>
                <p class="relative text-gray-400 text-sm leading-relaxed">Launch the AI canvas and generate a new interface using natural language.</p>
            </a>
            
            <!-- Database History Card (Locked State) -->
            <div class="relative block bg-black/40 border border-white/5 p-8 rounded-3xl opacity-60 cursor-not-allowed overflow-hidden">
                <div class="relative w-14 h-14 bg-gray-800/80 rounded-2xl flex items-center justify-center mb-6 border border-gray-700">
                    <svg class="w-7 h-7 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                    </svg>
                </div>
                <h2 class="relative text-2xl font-bold mb-2 text-gray-400">Design History</h2>
                <p class="relative text-gray-500 text-sm leading-relaxed">Saved generations will appear here once the database is connected.</p>
                
                <!-- "Coming Soon" Badge -->
                <div class="absolute top-8 right-8 bg-gray-800 text-xs font-bold px-3 py-1 rounded-full text-gray-400 border border-gray-700">
                    Coming Soon
                </div>
            </div>
        </div>
    </main>
</body>
</html>ss
