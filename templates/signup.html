<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | FluxOrigami</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Themed form styling for Django's auto-generated inputs */
        input { 
            width: 100%; 
            padding: 0.75rem 1rem; 
            border-radius: 0.75rem; 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white; 
            margin-bottom: 0.5rem; 
            transition: all 0.3s ease;
        }
        input:focus { 
            outline: none; 
            border-color: #d946ef; /* Fuchsia-500 */
            box-shadow: 0 0 0 1px #d946ef, 0 0 15px rgba(217, 70, 239, 0.2); 
            background: rgba(0, 0, 0, 0.6); 
        }
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            color: #9ca3af; 
            font-size: 0.875rem; 
            font-weight: 500; 
            margin-top: 1rem;
        }
        /* Django specific signup text styling */
        .helptext { 
            font-size: 0.75rem; 
            color: #6b7280; 
            display: block; 
            margin-bottom: 0.5rem; 
            line-height: 1.4;
        }
        ul.errorlist { 
            color: #f87171; 
            font-size: 0.875rem; 
            margin-bottom: 1rem; 
            background: rgba(248, 113, 113, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(248, 113, 113, 0.2);
            list-style-type: none;
        }
    </style>
</head>
<body class="bg-black bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-fuchsia-900/30 via-black to-black text-white min-h-screen flex justify-center font-sans p-4 selection:bg-fuchsia-500/30 relative overflow-x-hidden overflow-y-auto">
    
    <!-- Ambient Background Elements -->
    <div class="absolute top-0 right-0 w-96 h-96 bg-purple-900/20 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 w-96 h-96 bg-fuchsia-900/20 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- Back to Home Button -->
    <a href="{% url 'home' %}" class="absolute top-8 left-6 md:left-12 flex items-center gap-2 text-gray-400 hover:text-white transition-colors group font-medium z-50">
        <svg class="w-5 h-5 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Back to Home
    </a>

    <!-- Signup Card (Added my-auto and mt-20 for proper scrolling alignment) -->
    <div class="relative bg-white/5 backdrop-blur-xl border border-white/10 p-8 sm:p-10 rounded-3xl shadow-2xl max-w-md w-full z-10 my-auto mt-20 mb-10">
        
        <!-- Decorative subtle glow inside card -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-fuchsia-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Logo Icon -->
        <div class="flex justify-center mb-6">
            <div class="w-12 h-12 bg-gradient-to-br from-fuchsia-600 to-purple-600 rounded-2xl flex items-center justify-center font-bold text-xl shadow-[0_0_15px_rgba(192,38,211,0.5)]">F</div>
        </div>

        <h2 class="text-3xl font-extrabold mb-2 text-center text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">Create Account</h2>
        <p class="text-gray-400 text-center mb-8 text-sm">Join FluxOrigami to start generating UI.</p>
        
        <form method="post" class="w-full relative z-10">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full mt-8 bg-gradient-to-r from-fuchsia-600 to-purple-600 hover:from-fuchsia-500 hover:to-purple-500 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-[0_0_15px_rgba(192,38,211,0.4)] hover:shadow-[0_0_25px_rgba(192,38,211,0.6)] transform hover:-translate-y-0.5 flex justify-center items-center gap-2">
                Sign Up
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>
        
        <p class="text-center mt-8 text-sm text-gray-400">
            Already have an account? 
            <a href="{% url 'login' %}" class="text-fuchsia-400 hover:text-fuchsia-300 font-medium transition-colors border-b border-transparent hover:border-fuchsia-400 pb-0.5">Log in</a>
        </p>
    </div>
</body>
</html>
